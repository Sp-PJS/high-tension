server:
  port: 8200

spring:
  application:
    name: product-service
  datasource:
    url: jdbc:mysql://localhost:3306/product_service?serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: admin1234
    driver-class-name: com.mysql.cj.jdbc.Driver
    # [추가] 동시성 테스트(100회 이상) 시 DB 커넥션 부족으로 인한 Feign 500 에러 방지
    hikari:
      maximum-pool-size: 50       # 기본값 10에서 50으로 상향
      minimum-idle: 10
      connection-timeout: 5000    # 커넥션 획득 대기 시간 5초
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_schema: product_service
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  data: # 에러 발생하면 이 부분 삭제하기
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms # [수정] 부하 상황을 고려하여 타임아웃 5초로 완화

  cache:
    type: redis
#    redis:
#      time-to-live: 5000
#      cache-null-values: false
#      use-key-prefix: true
#      key-prefix: "product::" # 이 부분이 에러원인(""로 감싸줘야 함)

redisson:
  mode: single
  single:
    address: redis://localhost:6379
    #  mode: cluster # 나중에 K8s로 배포를 한다고 가정하면 필요한 코드
    #  cluster:
    #    nodes:
    #      - redis://redis-0.redis:6379
    #      - redis://redis-1.redis:6379
    #      - redis://redis-2.redis:6379

    # [추가] Redisson 자체의 커넥션 풀도 상향하여 락 획득 시 병목 제거
    connectionMinimumIdleSize: 10
    connectionPoolSize: 64

management:
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.high.product: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql: TRACE
  logback:
    rollingpolicy:
      max-file-size: 10MB           # 파일 최대 크기
      max-history: 7                # 7일간 보관
      total-size-cap: 1GB           # 전체 로그 최대 1GB
      clean-history-on-start: true  # 시작 시 오래된 로그 정리
