server:
  port: 8400

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:mysql://localhost:3306/order_service?serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: admin1234
    driver-class-name: com.mysql.cj.jdbc.Driver
    # [추가] 100회 동시성 테스트 시 주문 생성 트랜잭션 점유를 위한 커넥션 풀 확장
    hikari:
      maximum-pool-size: 50       # product-service와 동일하게 50으로 상향
      minimum-idle: 10
      connection-timeout: 5000    # 5초 내 커넥션 미획득 시 에러 발생 방지
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_schema: order_service
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  # [추가] Redis 및 캐시 설정 (order에서도 타임아웃 완화가 필요할 수 있음)
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms

management:
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.high.order: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql: TRACE
  logback:
    rollingpolicy:
      max-file-size: 10MB           # 파일 최대 크기
      max-history: 7                # 7일간 보관
      total-size-cap: 1GB           # 전체 로그 최대 1GB
      clean-history-on-start: true  # 시작 시 오래된 로그 정리